apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-server-deployment
spec:
  replicas: 2  # Aquí pedimos 2 copias para ver el balanceo
  selector:
    matchLabels:
      app: go-server
  template:
    metadata:
      labels:
        app: go-server
    spec:
      containers:
      - name: go-container
        image: mi-app-go:v1   # El nombre exacto de la imagen 
        imagePullPolicy: Never # Le dice a K8s que use la imagen del PC, no de internet
        ports:
        - containerPort: 8080 # El puerto que se abre en el Dockerfile
---
apiVersion: v1
kind: Service
metadata:
  name: go-server-service
spec:
  type: LoadBalancer # Esto da una IP para entrar (localhost)
  selector:
    app: go-server
  ports:
    - protocol: TCP
      port: 80      # Entramos por el puerto 80 (navegador)
      targetPort: 8080 # redirige al 8080 de la app
